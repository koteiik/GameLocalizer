name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GameLocalizer.sln
      - run: dotnet build GameLocalizer.sln -c Release --no-restore
      - run: dotnet test GameLocalizer.sln -c Release --no-build
