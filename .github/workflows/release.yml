name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected vX.Y.Z' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet restore GameLocalizer.sln
      - run: dotnet build GameLocalizer.sln -c Release --no-restore
      - run: dotnet test GameLocalizer.sln -c Release --no-build
      - run: dotnet publish src/GameLocalizer.UI -c Release -r win-x64 --self-contained true -p:Version=${{ env.RELEASE_VERSION }} -o artifacts/publish
      - name: Package
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/publish/GameLocalizer.exe)) { throw 'Executable missing' }
          if (!(Test-Path artifacts/publish/GameLocalizer.ModelHost.exe)) { throw 'Model host missing' }
          if (Get-ChildItem artifacts/publish -Recurse -Include *.onnx,*.spm) { throw 'Model weights must not be packaged' }
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md artifacts/publish/
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/GameLocalizer-win-x64.zip
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' artifacts/GameLocalizer-win-x64.zip --title 'GameLocalizer ${{ github.ref_name }}' --generate-notes --verify-tag
