name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to package and publish
        required: true
        type: string
permissions:
  contents: write
jobs:
  installer-validation:
    uses: ./.github/workflows/installer-e2e.yml
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected vX.Y.Z' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet restore GameLocalizer.sln
      - run: dotnet build GameLocalizer.sln -c Release --no-restore
      - run: dotnet test GameLocalizer.sln -c Release --no-build
      - run: dotnet publish src/GameLocalizer.UI -c Release -r win-x64 --self-contained true -p:Version=${{ env.RELEASE_VERSION }} -o artifacts/publish
      - name: Optional production Authenticode signing
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $files = @(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Name -like 'GameLocalizer*' -and $_.Extension -in '.exe','.dll' } | ForEach-Object FullName)
          ./scripts/Sign-Release.ps1 -Files $files
      - name: Package
        shell: pwsh
        run: |
          ./scripts/Package.ps1 -PublishDirectory artifacts/publish -Version '${{ env.RELEASE_VERSION }}' -ZipPath artifacts/GameLocalizer-Portable-x64.zip
          ./scripts/Build-Installer.ps1 -PublishDirectory artifacts/publish -OutputDirectory artifacts
      - name: Sign Setup and finalize checksums
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          ./scripts/Sign-Release.ps1 -Files artifacts/GameLocalizer-Setup-x64.exe
          ./scripts/Finalize-InstallerRelease.ps1 -Directory artifacts
          $status = (Get-AuthenticodeSignature artifacts/GameLocalizer-Setup-x64.exe).Status
          $notes = 'docs/RELEASE-${{ env.RELEASE_VERSION }}.md'
          if (Test-Path -LiteralPath $notes) { Copy-Item -LiteralPath $notes -Destination artifacts/release-notes.md }
          else { "GameLocalizer v${{ env.RELEASE_VERSION }}" | Set-Content artifacts/release-notes.md }
          "`nInstaller signature: $status. See SHA256SUMS.txt. No test signing is used." | Add-Content artifacts/release-notes.md
      - name: Retain exact release assets for clean-profile validation
        uses: actions/upload-artifact@v4
        with:
          name: production-release-assets
          path: |
            artifacts/GameLocalizer-Setup-x64.exe
            artifacts/GameLocalizer-Portable-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/installer-manifest.json
            artifacts/release-notes.md
          retention-days: 30
  production-installer-validation:
    needs: [installer-validation, release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: production-release-assets
          path: artifacts
      - name: Test exact production installer in clean profile
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          ./scripts/Test-ProductionInstaller.ps1 -Setup artifacts/GameLocalizer-Setup-x64.exe -Version $version
      - name: Create draft pending local Defender verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ inputs.tag || github.ref_name }}' artifacts/GameLocalizer-Setup-x64.exe artifacts/GameLocalizer-Portable-x64.zip artifacts/SHA256SUMS.txt --draft --title 'GameLocalizer ${{ inputs.tag || github.ref_name }}' --notes-file artifacts/release-notes.md --generate-notes --verify-tag
